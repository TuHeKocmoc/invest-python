[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tinkoff-investments"
version = "0.2.0-beta59"
description = ""
authors = ["Danil Akhtarov <d.akhtarov@tinkoff.ru>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Tinkoff/invest-python"
homepage = "https://github.com/Tinkoff/invest-python"
packages = [
    { include = "tinkoff" },
]
exclude = ["tinkoff/__init__.py"]

[tool.poetry.dependencies]
python = "^3.14"
cachetools = "^6.2.6"
grpcio = "^1.70.0"
protobuf = "^5.29.5"
python-dateutil = "^2.9.0"
deprecation = "^2.1.0"
matplotlib = { version = "^3.7.5", optional = true}
mplfinance = { version = "^0.12.10b0", optional = true}
numpy = { version = "^1.24.4", optional = true}
pandas = { version = ">=1.4.0", optional = true}

[tool.poetry.extras]
all = ["pandas", "numpy", "matplotlib", "mplfinance"]

[tool.poetry.group.bump.dependencies]
PyYAML = "^6.0"
tomlkit = "^0.13.3"

[tool.poetry.group.dev.dependencies]
autoflake = "^1.4"
bandit = "^1.7.10"
black = {extras = ["jupyter"], version = "^24.3.0"}
codecov = "^2.1.12"
flake8 = "^5.0.4"
flake8-annotations-complexity = "^0.0.8"
flake8-bandit = "^4"
flake8-breakpoint = "^1.1.0"
flake8-bugbear = "^23.3.12"
flake8-builtins = "^3.1.0"
flake8-comprehensions = "^3.15.0"
flake8-eradicate = "^1.5.0"
flake8-if-expr = "^1.0.4"
flake8-isort = "^6.1.1"
flake8-logging-format = "^2024.24.12"
flake8-print = "^5.0.0"
flake8-pytest = "^1.3"
flake8-pytest-style = "^2.2.0"
flake8-requirements = "^2.3.0"
flake8-return = "^1.1.3"
grpcio-tools = "^1.53.2"
ipython = "^9.9.0"
isort = "^5.13.2"
mypy = "^1.14"
mypy-protobuf = "^5.0.0"
pylint = "^3.2.7"
pytest = "^8.3.5"
pytest-asyncio = "^1.3.0"
pytest-cov = "^5.0.0"
pytest-deadfixtures = "^3.1.0"
pytest-freezegun = "^0.4.2"
pytest-mock = "^3.14.1"
requests = "^2.32.4"
ruff = "^0.14.14"
toml-sort = "^0.23.1"
types-cachetools = "^5.5.0"
types-protobuf = "^5.29.1.20241207"
types-python-dateutil = "^2.9.0"
types-PyYAML = "^6.0.12"
types-requests = "^2.32.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-include-markdown-plugin = "^7.2.1"
mkdocs-material = "^9.7.1"
mkdocstrings = { version = "^1.0.2", extras = ["python"] }
termynal = "^0.2.0"

[tool.ruff]
line-length = 88
select = [
    "D",
    "B",
    "C",
    "E",
    "F",
    "Q",
    "RUF001",
    "T",
    "W",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "B008",
    "B905",
    "Q000",
]
exclude = [
    "tinkoff/invest/grpc",
    "examples/*",
]
